services:
  souvenir:
    container_name: souvenir
    image: souvenir:#{image_tag}#
    restart: unless-stopped
    environment:
      SOUV__db__url: postgres
      SOUV__db__port: "5432"
      SOUV__db__user: souvenir
      SOUV__db__password: ${DB_PASSWORD:?set DB_PASSWORD in secrets.enc.env}
      SOUV__api__url: https://api.mistral.ai
      SOUV__api__key: ${API_KEY:?set API_KEY in secrets.enc.env}
      SOUV__llm__model: mistral-small-latest
      SOUV__embedding__url: https://api.mistral.ai
      SOUV__embedding__key: ${EMBEDDING_KEY:-}
      SOUV__embedding__model: Qwen/Qwen3-Embedding-0.6B-GGUF:Q8_0
      SOUV__embedding__dim: "1024"
      SOUV__calendars__path: /calendars
      SOUV__calendars__read: home,work
      SOUV__calendars__write: assistant
      SOUV__calendars__timezone: Europe/Brussels
      AUTHORIZED_KEYS: ${AUTHORIZED_KEYS:?set AUTHORIZED_KEYS in secrets.enc.env}
    volumes:
      - souvenir_data:/data
      - /home/master/docker/calendar/data/calendars:/calendars
    ports:
      - "2223:23234"
    networks:
      - db-network
      - llm-network

volumes:
  souvenir_data:

networks:
  db-network:
    name: db-network
    external: true
