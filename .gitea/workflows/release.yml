name: Release

# A release is a version tag: `git tag v0.1.0 && git push --tags`. The image is
# built on the server's Docker and the container replaced in place.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: sh
    steps:
      - name: Checkout code
        run: |
          git clone --depth 1 --branch ${{ gitea.ref_name }} http://gitea-actions:${{ gitea.token }}@gitea:3030/${{ gitea.repository }}.git .

      - name: Work out the version
        run: |
          version="${{ gitea.ref_name }}"
          version="${version#v}"
          case "$version" in
            [0-9]*) ;;
            *) echo "Run this from a v* tag, not '${{ gitea.ref_name }}'"; exit 1 ;;
          esac
          echo "VERSION=$version" >> "$GITEA_ENV"

      - name: Install sops
        env:
          SOPS_VERSION: v3.13.3
        run: |
          base="https://github.com/getsops/sops/releases/download/$SOPS_VERSION"
          curl -fsSLo sops "$base/sops-$SOPS_VERSION.linux.amd64"
          curl -fsSLo sops.checksums.txt "$base/sops-$SOPS_VERSION.checksums.txt"
          echo "$(grep " sops-$SOPS_VERSION.linux.amd64\$" sops.checksums.txt | cut -d' ' -f1)  sops" | sha256sum -c
          install -m 755 sops /usr/local/bin/sops
          rm sops sops.checksums.txt

      - name: Build image
        run: docker build -t "souvenir:$VERSION" .

      - name: Set image tag in docker-compose.yml
        run: sed -i "s/#{image_tag}#/$VERSION/g" ./docker-compose.yml

      # exec-env hands the decrypted values to compose as environment variables,
      # so no plaintext .env is written to the runner's disk.
      - name: Deploy
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          [ -n "$SOPS_AGE_KEY" ] || { echo "Missing secret: SOPS_AGE_KEY"; exit 1; }
          sops exec-env secrets.enc.env 'docker compose -p souvenir -f ./docker-compose.yml up -d'

      - name: Prune old images
        run: |
          docker image ls souvenir --format '{{.Repository}}:{{.Tag}}' \
            | grep -v "^souvenir:$VERSION$" \
            | xargs -r docker rmi -f || true
