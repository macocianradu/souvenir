name: Release

# A release is a version tag: `git tag v0.1.0 && git push --tags`. This only
# builds and publishes the image. What runs, and with which configuration and
# secrets, is the souvenir-deploy repo's job; this workflow moves it onto the
# new version.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: sh
    steps:
      - name: Checkout code
        run: |
          git clone --depth 1 --branch ${{ gitea.ref_name }} http://gitea-actions:${{ gitea.token }}@gitea:3030/${{ gitea.repository }}.git .

      - name: Work out the version
        run: |
          version="${{ gitea.ref_name }}"
          version="${version#v}"
          case "$version" in
            [0-9]*) ;;
            *) echo "Run this from a v* tag, not '${{ gitea.ref_name }}'"; exit 1 ;;
          esac
          echo "VERSION=$version" >> "$GITEA_ENV"

      # Secrets are read by the step that uses them: the runner leaves them empty,
      # without failing, when they are referenced from a job-level env.
      - name: Work out the image name
        env:
          REGISTRY: ${{ secrets.REGISTRY }}
        run: |
          [ -n "$REGISTRY" ] || { echo "secrets.REGISTRY is empty. It holds the Gitea host (e.g. git.example.org)."; exit 1; }
          registry="${REGISTRY#http://}"
          registry="${registry#https://}"
          registry="${registry%/}"
          echo "REGISTRY=$registry" >> "$GITEA_ENV"
          echo "IMAGE=$registry/radumaco/souvenir" >> "$GITEA_ENV"

      - name: Build image
        run: docker build -t "$IMAGE:$VERSION" .

      - name: Push image
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
          docker push "$IMAGE:$VERSION"

      # The deploy repo redeploys off this commit.
      - name: Move the deployment onto this version
        env:
          DEPLOY_REPO_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
        run: |
          # Outside the checkout, whose own deploy/ holds the image's config.
          repo=$(mktemp -d)
          git clone --depth 1 "http://radumaco:$DEPLOY_REPO_TOKEN@gitea:3030/radumaco/souvenir-deploy.git" "$repo"
          cd "$repo"
          git config user.name "souvenir release"
          git config user.email "noreply@macocian.com"
          sed -i "s|^SOUVENIR_TAG=.*|SOUVENIR_TAG=$VERSION|" versions.env
          git diff --quiet && { echo "already on $VERSION"; exit 0; }
          git commit -am "souvenir $VERSION"
          git push

      - name: Remove local image
        if: always()
        run: docker rmi -f "$IMAGE:$VERSION" || true
